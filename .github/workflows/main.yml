name: Deploy
on:
  push:
    branches:
      - main
concurrency:
  group: main
jobs:
  test:
    uses: ./.github/workflows/test.yml

  install:
    name: Install
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - name: Store Keys
        run: |
          echo secrets!!!

  deploy-dev:
    name: Deploy for Development
    runs-on: ubuntu-latest
    needs: install
    if: success()
    steps:
      - name: Store Keys
        run: |
          echo secrets!!!

  deploy-prd:
    name: Deploy for Production
    runs-on: ubuntu-latest
    needs: install
    if: success() && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Store Keys
        run: |
          echo secrets!!!


